<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Ultimate Hub</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; display: flex; height: 100vh; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; }
        .message { padding: 10px; margin: 5px; border-radius: 10px; background: #333; }
        .input-area { padding: 10px; display: flex; gap: 5px; background: #111; }
        input { flex: 1; padding: 10px; }
        img { max-width: 100%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="main-content">
        <div id="chat-window"><div class="message">ආයුබෝවන්! ඔබේ Nexus AI සූදානම්.</div></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="ඔබේ ප්‍රශ්නය...">
            <button onclick="handleSubmit()">යවන්න</button>
        </div>
    </div>
    <script>
        // ඉතාම සරල API call එකක්
        async function handleSubmit() {
            const input = document.getElementById("user-input");
            const prompt = input.value;
            const chat = document.getElementById("chat-window");
            
            chat.innerHTML += `<div class="message">ඔයා: ${prompt}</div>`;
            
            // පින්තූර සඳහා Pollinations කෙලින්ම IMG ටැග් එකෙන්
            const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}`;
            chat.innerHTML += `<div class="message">AI: පින්තූරය ජෙනරේට් වේ... <br><img src="${imgUrl}" onerror="this.style.display='none'"></div>`;
            
            input.value = "";
        }
    </script>
</body>
</html>
