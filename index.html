<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Hub</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { text-align: center; padding: 15px; background: #1f1f1f; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; background: #1f1f1f; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: white; font-size: 1rem; outline: none; }
        button { padding: 0 20px; margin-left: 8px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">Nexus AI Hub</div>
    
    <div id="chat-window">
        <div class="message ai-msg">ආයුබෝවන්! මම ඔබේ Nexus AI සහායකයා. ඔබට අද අවශ්‍ය කුමක්ද?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="ඔබේ ප්‍රශ්නය මෙතන ලියන්න..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">යවන්න</button>
    </div>

    <script>
        // ඔයාගේ API Key එක මෙහි සටහන් කර ඇත
        const apiKey = "AQ.Ab8RN6JXqWHtWv8CxU4IGZlV7WJnMolOv39PyPziWabZcRCE3w"; 

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatWindow = document.getElementById("chat-window");
            const prompt = inputField.value.trim();
            if (!prompt) return;

            // User message එක ඇඩ් කිරීම
            chatWindow.innerHTML += `<div class="message user-msg">${escapeHtml(prompt)}</div>`;
            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Loading message එකක් පෙන්වීම
            const loadingId = "loading-" + Date.now();
            chatWindow.innerHTML += `<div class="message ai-msg" id="${loadingId}">කල්පනා කරමින් පවතී...</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch(`httpsgenerativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatWindow.innerHTML += `<div class="message ai-msg">${escapeHtml(reply)}</div>`;
                } else {
                    chatWindow.innerHTML += `<div class="message ai-msg">සමාවන්න, උත්තරයක් ලබා දීමේ දෝෂයක් සිදු විය.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `<div class="message ai-msg">ජාල දෝෂයක් (Network error) සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
