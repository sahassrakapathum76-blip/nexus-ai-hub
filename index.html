<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගේ AI ඇප් එක</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; overflow: hidden; }
        h2 { background: #007bff; color: white; margin: 0; padding: 15px; text-align: center; font-size: 20px; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: #d1e7dd; align-self: flex-end; color: #0f5132; }
        .ai-msg { background: #cfe2ff; align-self: flex-start; color: #084298; }
        .loading { font-style: italic; color: #666; }
        .input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #ddd; gap: 10px; }
        input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>මගේ AI සහයකයා 🤖</h2>
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">ආයුබෝවන්! මම සූදානම්. මගෙන් ඕනෑම ප්‍රශ්නයක් අසන්න.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="ප්‍රශ්නයක් ලියන්න...">
        <button onclick="sendMessage()">යවන්න</button>
    </div>
</div>

<script>
    const apiKey = "AQ.Ab8RN6Kp3yrs0PvYreMWc65m634_f_tA0vYzOxrKSIkI3B9h4Q"; 

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const userText = inputField.value.trim();

        if (userText === '') return;

        chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-msg loading">මොහොතක් ඉන්න, කල්පනා කරමින් පවතියි...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userText }] }]
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div class="message ai-msg">${aiReply}</div>`;
            } else if (data.error) {
                chatBox.innerHTML += `<div class="message ai-msg">දෝෂයක්: ${data.error.message}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai-msg">සමාවෙන්න, උත්තරයක් ලබා ගැනීමේ දෝෂයක් සිදු විය.</div>`;
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai-msg">සම්බන්ධතාවයේ දෝෂයක් පවතී.</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
