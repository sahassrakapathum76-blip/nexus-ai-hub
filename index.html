<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#764ba2">
<meta name="description" content="Nexus AI Hub - All in One AI">
<link rel="manifest" href="manifest.json">

<title>Nexus AI Hub</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080a0f;
  --panel:#151923;
  --panel2:#1b202b;
  --border:rgba(255,255,255,.10);
  --text:#f4f7fb;
  --muted:#9aa3b2;
  --accent:#764ba2;
  --accent2:#667eea;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Sinhala",sans-serif;
  background:linear-gradient(135deg,#080a0f,#10131b);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  width:100%;
  height:100%;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:280px;
  min-width:280px;
  height:100%;
  background:rgba(21,25,35,.97);
  border-right:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  font-size:22px;
}

.brand-text{
  font-size:18px;
  font-weight:800;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
}

.new-chat{
  width:100%;
  padding:13px;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  margin-bottom:18px;
}

.history-title{
  color:var(--muted);
  font-size:12px;
  margin:8px 0;
}

.history{
  flex:1;
  overflow:auto;
}

.history-item{
  padding:11px;
  border:1px solid transparent;
  border-radius:10px;
  margin-bottom:5px;
  color:#dce1e8;
}

.history-item:hover{
  background:rgba(255,255,255,.05);
  border-color:var(--border);
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.side-link{
  width:100%;
  display:block;
  padding:11px;
  border-radius:10px;
  color:#dce1e8;
  background:transparent;
  text-align:left;
  text-decoration:none;
}

.side-link:hover{
  background:rgba(255,255,255,.06);
}

/* MAIN */
.main{
  min-width:0;
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:rgba(8,10,15,.85);
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:11px;
  color:white;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:20px;
}

.mobile-menu{
  display:none;
}

.model-select{
  color:white;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
  outline:none;
}

.topbar-spacer{
  flex:1;
}

/* CHAT */
.chat-window{
  flex:1;
  overflow:auto;
  padding:24px 18px;
}

.chat-container{
  width:min(900px,100%);
  margin:auto;
}

.welcome{
  min-height:45vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.welcome-logo{
  font-size:55px;
}

.welcome h1{
  margin:8px 0;
  font-size:30px;
}

.welcome p{
  color:var(--muted);
}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:min(700px,100%);
  margin-top:20px;
}

.quick{
  padding:13px;
  color:#dce1e8;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  text-align:left;
}

.quick:hover{
  border-color:#764ba2;
}

/* MESSAGES */
.message-row{
  display:flex;
  margin:16px 0;
}

.message-row.user{
  justify-content:flex-end;
}

.message{
  max-width:min(760px,90%);
  padding:13px 15px;
  border-radius:15px;
  line-height:1.55;
  white-space:pre-wrap;
}

.user .message{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
}

.ai .message{
  background:var(--panel2);
  border:1px solid var(--border);
}

/* COMPOSER */
.composer-area{
  padding:10px 18px 18px;
}

.composer{
  width:min(900px,100%);
  margin:auto;
}

.mode-bar{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.mode{
  padding:9px 13px;
  border-radius:10px;
  color:#b9c0cc;
  background:var(--panel2);
  border:1px solid var(--border);
}

.mode.active{
  color:white;
  border-color:#764ba2;
  background:rgba(118,75,162,.25);
}

.input-box{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel);
}

textarea{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:10px;
}

.tool
