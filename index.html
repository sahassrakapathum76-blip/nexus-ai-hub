<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Ultimate Hub</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { text-align: center; padding: 15px; background: #1f1f1f; font-weight: bold; border-bottom: 1px solid #333; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 90%; padding: 12px; border-radius: 12px; word-wrap: break-word; line-height: 1.4; }
        .user-msg { background: #007bff; align-self: flex-end; color: white; }
        .ai-msg { background: #2a2a2a; align-self: flex-start; color: #e0e0e0; }
        .ai-msg img, .ai-msg video { max-width: 100%; border-radius: 8px; margin-top: 8px; }
        .input-area { padding: 10px; background: #1f1f1f; border-top: 1px solid #333; }
        .mode-select { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
        .mode-btn { background: #333; border: none; color: #fff; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
        .mode-btn.active { background: #007bff; }
        .input-row { display: flex; gap: 5px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: white; font-size: 1rem; outline: none; }
        button { padding: 0 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">Nexus AI Ultimate Hub</div>
    
    <div id="chat-window">
        <div class="message ai-msg">ආයුබෝවන්! මම ඔබේ Nexus AI සහායකයා. ඔබට අවශ්‍ය පරිදි චැට් කිරීමට, පින්තූර සෑදීමට හෝ වීඩියෝ ජෙනරේට් කර ගැනීමට හැකියාව ඇත.</div>
    </div>

    <div class="input-area">
        <div class="mode-select">
            <button class="mode-btn active" id="btn-chat" onclick="setMode('chat')">💬 චැට්</button>
            <button class="mode-btn" id="btn-image" onclick="setMode('image')">🖼️ පින්තූර</button>
            <button class="mode-btn" id="btn-video" onclick="setMode('video')">🎬 වීඩියෝ</button>
        </div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="ඔබේ ප්‍රශ්නය මෙතන ලියන්න..." onkeypress="handleKeyPress(event)">
            <button onclick="handleSubmit()">යවන්න</button>
        </div>
    </div>

    <script>
        // API Keys සටහන් කර ඇත
        const geminiApiKey = "AQ.Ab8RN6JXqWHtWv8CxU4IGZlV7WJnMolOv39PyPziWabZcRCE3w";
        const replicateApiToken = "R8_API4i8KE0lQ1p82XYemHpYDjtyEGecF3wLIBx";

        let currentMode = 'chat';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');
            
            const input = document.getElementById('user-input');
            if (mode === 'image') input.placeholder = "අවශ්‍ය පින්තූරය ගැන විස්තරයක් ලියන්න...";
            else if (mode === 'video') input.placeholder = "අවශ්‍ය වීඩියෝව ගැන විස්තරයක් ලියන්න...";
            else input.placeholder = "ඔබේ ප්‍රශ්නය මෙතන ලියන්න...";
        }

        async function handleSubmit() {
            const input = document.getElementById("user-input");
            const chat = document.getElementById("chat-window");
            const prompt = input.value.trim();
            if (!prompt) return;

            chat.innerHTML += `<div class="message user-msg">${escapeHtml(prompt)}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            const loadId = "load-" + Date.now();
            chat.innerHTML += `<div class="message ai-msg" id="${loadId}">සකස් කරමින් පවතී...</div>`;
            chat.scrollTop = chat.scrollHeight;

            if (currentMode === 'chat') await fetchChat(prompt, loadId);
            else if (currentMode === 'image') await fetchImage(prompt, loadId);
            else await fetchVideo(prompt, loadId);
        }

        async function fetchChat(prompt, loadId) {
            const chat = document.getElementById("chat-window");
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                document.getElementById(loadId).remove();
                if (data.candidates && data.candidates[0].content) {
                    chat.innerHTML += `<div class="message ai-msg">${escapeHtml(data.candidates[0].content.parts[0].text)}</div>`;
                } else {
                    chat.innerHTML += `<div class="message ai-msg">දෝෂයක් සිදු විය.</div>`;
                }
            } catch (e) {
                document.getElementById(loadId).remove();
                chat.innerHTML += `<div class="message ai-msg">ජාල දෝෂයක් සිදු විය.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        async function fetchImage(prompt, loadId) {
            document.getElementById(loadId).remove();
            const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
            document.getElementById("chat-window").innerHTML += `<div class="message ai-msg">ඔන්න ඔබේ පින්තූරය:<br><img src="${imgUrl}" alt="${escapeHtml(prompt)}"></div>`;
            document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;
        }

        async function fetchVideo(prompt, loadId) {
            const chat = document.getElementById("chat-window");
            try {
                // Replicate API හරහා වීඩියෝ සෑදීමට ඉල්ලීම යැවීම (Stable Video Diffusion හෝ AnimateDiff වැනි මොඩල් එකක් සඳහා)
                const response = await fetch("https://api.replicate.com/v1/predictions", {
                    method: "POST", 
                    headers: { 
                        "Authorization": `Bearer ${replicateApiToken}`, 
                        "Content-Type": "application/json",
                        "Prefer": "wait"
                    },
                    body: JSON.stringify({ 
                        version: "9f747673945c62801b13b84701c743929c819125132e4d2a7a274ab2cb46d16f", 
                        input: { prompt: prompt } 
                    })
                });
                const data = await response.json();
                document.getElementById(loadId).remove();

                if (data.output) {
                    chat.innerHTML += `<div class="message ai-msg"><b>🎬 ඔබේ වීඩියෝව සූදානම්:</b><br><video controls src="${data.output}" style="width:100%; border-radius:8px;"></video></div>`;
                } else {
                    chat.innerHTML += `<div class="message ai-msg">වීඩියෝව සැකසීමේදී යම් දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.</div>`;
                }
            } catch (e) {
                document.getElementById(loadId).remove();
                chat.innerHTML += `<div class="message ai-msg">වීඩියෝ ඉල්ලීම ක්‍රියාත්මක කිරීමේදී දෝෂයක් සිදු විය.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") handleSubmit();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
