<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .header { text-align: center; padding: 20px; color: white; font-size: 24px; font-weight: bold; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .user-msg { background: white; align-self: flex-end; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ai-msg { background: rgba(255, 255, 255, 0.95); align-self: flex-start; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-area { background: white; padding: 12px 15px; display: flex; gap: 10px; align-items: center; border-radius: 50px; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        input { flex: 1; padding: 10px; border: none; outline: none; font-size: 16px; }
        button { border: none; background: none; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>
    <div class="header">Nexus AI Hub 🤖</div>
    <div id="chat-window"><div class="message ai-msg">හායි! ඕනෑම ප්‍රශ්නයක් අසන්න.</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="ප්‍රශ්නයක් අහන්න..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">🚀</button>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6LG5TajlIan36MSJ1wF_uag8sTz9SIvo1zk7bcv0--M6g'; 

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat-window');
            const userText = input.value.trim();
            if(!userText) return;

            chat.innerHTML += `<div class="message user-msg">${userText}</div>`;
            input.value = '';
            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div id="${loadingId}" class="message ai-msg">සිතමින් පවතී...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
                });
                const data = await response.json();
                if (data.candidates) {
                    document.getElementById(loadingId).innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
                } else {
                    document.getElementById(loadingId).innerText = "සමාවෙන්න, උත්තරයක් ලැබුණේ නැත.";
                }
            } catch (e) { document.getElementById(loadingId).innerText = "අන්තර්ජාල දෝෂයකි."; }
            chat.scrollTop = chat.scrollHeight;
        }
        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
