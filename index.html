<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .header { text-align: center; padding: 20px; color: white; font-size: 24px; font-weight: bold; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .user-msg { background: white; align-self: flex-end; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ai-msg { background: rgba(255, 255, 255, 0.95); align-self: flex-start; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-area { background: white; padding: 12px 15px; display: flex; gap: 10px; align-items: center; border-radius: 50px; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        input[type="text"] { flex: 1; padding: 10px; border: none; outline: none; font-size: 16px; }
        button { border: none; background: none; cursor: pointer; font-size: 24px; }
        .send-btn { color: #764ba2; }
    </style>
</head>
<body>
    <div class="header">Nexus AI Hub 🤖</div>
    <div id="chat-window"><div class="message ai-msg">ආයුබෝවන්! මම සූදානම්. ඕනෑම ප්‍රශ්නයක් මගෙන් අසන්න.</div></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="ප්‍රශ්නයක් අහන්න..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">🚀</button>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6Kp3yrs0PvYreMWc65m634_f_tA0vYzOxrKSIkI3B9h4Q'; 

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat-window');
            const userText = input.value.trim();
            if(!userText) return;

            chat.innerHTML += `<div class="message user-msg">${userText}</div>`;
            input.value = '';
            
            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div id="${loadingId}" class="message ai-msg">කල්පනා කරමින් පවතී...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: userText }] }] 
                    }) 
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    document.getElementById(loadingId).innerHTML = aiReply.replace(/\n/g, '<br>');
                } else {
                    document.getElementById(loadingId).innerText = "සමාවෙන්න, මට පිළිතුරක් ලබා දීමට නොහැකි විය. (API සීමාවකි)";
                }
            } catch (e) { 
                document.getElementById(loadingId).innerText = "සන්නිවේදන දෝෂයක් සිදු විය."; 
            }
            chat.scrollTop = chat.scrollHeight;
        }

        function handleKeyPress(event) { 
            if (event.key === 'Enter') sendMessage(); 
        }
    </script>
</body>
</html>
