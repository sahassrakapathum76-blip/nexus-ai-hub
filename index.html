<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Hub - Ultimate Suite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { text-align: center; padding: 15px; background: #1f1f1f; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai-msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
        .input-area { display: flex; padding: 10px; background: #1f1f1f; border-top: 1px solid #333; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: white; font-size: 1rem; outline: none; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
        .mode-select { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .mode-btn { background: #333; border: none; color: #fff; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .mode-btn.active { background: #007bff; }
    </style>
</head>
<body>
    <div class="header">Nexus AI Ultimate Hub</div>
    
    <div id="chat-window">
        <div class="message ai-msg">ආයුබෝවන්! මම ඔබේ Nexus AI සහායකයා. ඔබට අවශ්‍ය පරිදි චැට් කිරීමට, පින්තූර සෑදීමට හෝ වීඩියෝ සංකල්ප සහ ප්‍රොම්ට් සකස් කර ගැනීමට හැකියාව ඇත.</div>
    </div>

    <div class="input-area">
        <div class="mode-select">
            <button class="mode-btn active" id="btn-chat" onclick="setMode('chat')">💬 චැට්</button>
            <button class="mode-btn" id="btn-image" onclick="setMode('image')">🖼️ පින්තූර</button>
            <button class="mode-btn" id="btn-video" onclick="setMode('video')">🎬 වීඩියෝ ප්‍රොම්ට්</button>
        </div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="ඔබේ ප්‍රශ්නය මෙතන ලියන්න..." onkeypress="handleKeyPress(event)">
            <button onclick="handleSubmit()">යවන්න</button>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6JXqWHtWv8CxU4IGZlV7WJnMolOv39PyPziWabZcRCE3w"; 
        let currentMode = 'chat';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-chat').classList.toggle('active', mode === 'chat');
            document.getElementById('btn-image').classList.toggle('active', mode === 'image');
            document.getElementById('btn-video').classList.toggle('active', mode === 'video');
            
            const inputField = document.getElementById('user-input');
            if (mode === 'image') {
                inputField.placeholder = "අවශ්‍ය පින්තූරය ගැන විස්තරයක් ලියන්න...";
            } else if (mode === 'video') {
                inputField.placeholder = "අවශ්‍ය වීඩියෝ දර්ශනය ගැන විස්තරයක් ලියන්න...";
            } else {
                inputField.placeholder = "ඔබේ ප්‍රශ්නය මෙතන ලියන්න...";
            }
        }

        async function handleSubmit() {
            const inputField = document.getElementById("user-input");
            const chatWindow = document.getElementById("chat-window");
            const prompt = inputField.value.trim();
            if (!prompt) return;

            chatWindow.innerHTML += `<div class="message user-msg">${escapeHtml(prompt)}</div>`;
            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatWindow.innerHTML += `<div class="message ai-msg" id="${loadingId}">සකස් කරමින් පවතී...</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            if (currentMode === 'chat') {
                await sendChatMessage(prompt, loadingId);
            } else if (currentMode === 'image') {
                await generateImage(prompt, loadingId);
            } else {
                await generateVideoConcept(prompt, loadingId);
            }
        }

        async function sendChatMessage(prompt, loadingId) {
            const chatWindow = document.getElementById("chat-window");
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatWindow.innerHTML += `<div class="message ai-msg">${escapeHtml(reply)}</div>`;
                } else {
                    chatWindow.innerHTML += `<div class="message ai-msg">සමාවන්න, දෝෂයක් සිදු විය.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `<div class="message ai-msg">ජාල දෝෂයක් සිදු විය.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function generateImage(prompt, loadingId) {
            const chatWindow = document.getElementById("chat-window");
            try {
                const encodedPrompt = encodeURIComponent(prompt);
                const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=512&height=512&nologo=true`;
                
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `<div class="message ai-msg">ඔන්න ඔබේ පින්තූරය:<br><img src="${imageUrl}" alt="${escapeHtml(prompt)}"></div>`;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `<div class="message ai-msg">පින්තූරය සෑදීමේදී දෝෂයක් ඇති විය.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function generateVideoConcept(prompt, loadingId) {
            const chatWindow = document.getElementById("chat-window");
            try {
                const videoPrompt = `Create a detailed cinematic video generation prompt and script breakdown for: ${prompt}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: videoPrompt }] }] })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatWindow.innerHTML += `<div class="message ai-msg"><b>🎬 වීඩියෝ සංකල්පය සහ ප්‍රොම්ට් එක:</b><br>${escapeHtml(reply)}</div>`;
                } else {
                    chatWindow.innerHTML += `<div class="message ai-msg">වීඩියෝ සංකල්පය සෑදීමේ දෝෂයක් සිදු විය.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `<div class="message ai-msg">ජාල දෝෂයක් සිදු විය.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                handleSubmit();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
