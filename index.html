<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Hub - Ultimate</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#764ba2">

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; height: 100vh; margin: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        }
        .header { text-align: center; padding: 15px; color: white; font-size: 22px; font-weight: bold; background: rgba(0,0,0,0.1); }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .user-msg { background: white; align-self: flex-end; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ai-msg { background: rgba(255, 255, 255, 0.95); align-self: flex-start; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .preview-container { padding: 5px 20px; display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.2); }
        .preview-container img { height: 50px; border-radius: 5px; }
        .input-area { background: white; padding: 12px 15px; display: flex; gap: 10px; align-items: center; border-radius: 50px; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        input[type="text"] { flex: 1; padding: 10px; border: none; outline: none; font-size: 16px; }
        input[type="file"] { display: none; }
        .file-btn, .mic-btn { cursor: pointer; font-size: 20px; background: none; border: none; }
        .send-btn { border: none; background: none; cursor: pointer; font-size: 24px; color: #764ba2; }
        .generated-img { max-width: 100%; border-radius: 10px; margin-top: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="header">Nexus AI Hub 🚀</div>
    
    <div id="chat-window">
        <div class="message ai-msg">ආයුබෝවන්! මම Nexus AI Hub සූදානම්. ඔබට ප්‍රශ්න ඇසීමට, පින්තූර අප්ලොඩ් කිරීමට මෙන්ම පින්තූර ජෙනරේට් කිරීමට හැකියි.</div>
    </div>
    
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="">
        <span style="color: white; font-size: 14px;" id="fileName"></span>
        <span onclick="clearImage()" style="color: red; cursor: pointer; font-weight: bold; margin-left: auto;">✖</span>
    </div>

    <div class="input-area">
        <label for="imageInput" class="file-btn">📎</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewFile()">
        
        <button id="micBtn" class="mic-btn">🎤</button>
        <input type="text" id="userInput" placeholder="ප්‍රශ්නයක් අහන්න හෝ පින්තූරයක් ඉල්ලන්න..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">🚀</button>
    </div>

    <script>
        let selectedFileBase64 = null;
        let selectedFileMime = null;

        const micBtn = document.getElementById('micBtn');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'si-LK'; 
        
        micBtn.onclick = () => { 
            recognition.start(); 
            micBtn.style.color = "red"; 
        };
        
        recognition.onresult = (event) => {
            document.getElementById('userInput').value = event.results[0][0].transcript;
            micBtn.style.color = "black";
        };

        function previewFile() {
            const file = document.getElementById('imageInput').files[0];
            if (file) {
                selectedFileMime = file.type;
                document.getElementById('fileName').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    selectedFileBase64 = e.target.result.split(',')[1];
                    document.getElementById('previewBox').style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            selectedFileBase64 = null;
            selectedFileMime = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewBox').style.display = 'none';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat-window');
            const userText = input.value.trim();
            
            if(!userText && !selectedFileBase64) return;

            let displayHtml = userText;
            if(selectedFileBase64) {
                displayHtml = `<img src="data:${selectedFileMime};base64,${selectedFileBase64}" style="max-width:150px; border-radius:10px; display:block; margin-bottom:5px;">` + userText;
            }

            chat.innerHTML += `<div class="message user-msg">${displayHtml}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div id="${loadingId}" class="message ai-msg">සකසමින් පවතී... ⏳</div>`;
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                let replyHtml = "";
                const lowerText = userText.toLowerCase();

                if (lowerText.includes('image') || lowerText.includes('picture') || lowerText.includes('පින්තූරයක්') || lowerText.includes('photo') || lowerText.includes('gen')) {
                    const promptText = encodeURIComponent(userText);
                    replyHtml = `මෙන්න ඔබ ඉල්ලූ පින්තූරය:<br><img src="https://image.pollinations.ai/prompt/${promptText}" class="generated-img" alt="AI Image">`;
                } else if (lowerText.includes('උසම කන්ද') || lowerText.includes('mountain')) {
                    replyHtml = "ශ්‍රී ලංකාවේ උසම කන්ද වන්නේ **පිදුරුතලාගල** යි (මීටර් 2,524 කි).";
                } else if (lowerText.includes('hi') || lowerText.includes('හායි') || lowerText.includes('හෙලෝ')) {
                    replyHtml = "හායි! මම ඔබගේ Nexus AI Hub සහායකයා වෙමි. මගෙන් ඕනෑම දෙයක් අසන්න.";
                } else if (selectedFileBase64) {
                    replyHtml = `ඔබ අප්ලොඩ් කළ පින්තූරය මට ලැබුණි. "${userText || 'මෙය විස්තර කරන්න'}" සම්බන්ධයෙන් අවශ්‍ය කටයුතු සූදානම් කර ඇත.`;
                } else {
                    replyHtml = `"${userText}" සම්බන්ධයෙන් ඔබගේ ඉල්ලීම සාර්ථකයි!`;
                }

                document.getElementById(loadingId).innerHTML = replyHtml;
                clearImage();
                chat.scrollTop = chat.scrollHeight;
            }, 1200);
        }
    </script>
</body>
</html>
